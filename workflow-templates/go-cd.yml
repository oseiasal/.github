name: Go CD Pipeline (Deploy ECR)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: go-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 1. Quality Gate antes do Deploy (Go)
  quality:
    name: Quality Gate (Lint & Tests)
    uses: oseiasal/.github/.github/workflows/reusable-go-quality.yml@main
    with:
      go-version: '1.22'

  # 2. Security Gate antes do Deploy (SAST & SCA)
  security:
    name: Security Gate (SAST & SCA)
    needs: quality
    uses: oseiasal/.github/.github/workflows/reusable-security.yml@main
    with:
      language: 'go'
      go-version: '1.22'
      trivy-severity: 'CRITICAL,HIGH'
      fail-on-critical: true

  # 3. Docker Build & Push para Amazon ECR (OIDC Exclusivo)
  deploy:
    name: Docker Build & ECR Push
    needs: [quality, security]
    permissions:
      id-token: write
      contents: read
    uses: oseiasal/.github/.github/workflows/reusable-docker-push.yml@main
    with:
      image-name: '$REPOSITORY_NAME'
      dockerfile-path: 'Dockerfile'
      aws-region: 'us-east-1'
      push-image: true
      tag-latest: true
    secrets:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
