name: Go CI/CD Pipeline

on:
  push:
    branches: [ $default-branch, main, master ]
  pull_request:
    branches: [ $default-branch, main, master ]

concurrency:
  group: go-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Compilação, Linter & Testes Unitários
  quality:
    name: Code Quality & Unit Tests
    uses: oseiasal/.github/.github/workflows/reusable-go-quality.yml@main
    with:
      go-version: '1.22'

  # 2. Segurança DevSecOps (SAST Gosec & SCA Trivy com bloqueio em CRITICAL)
  security:
    name: DevSecOps Security Analysis
    needs: quality
    uses: oseiasal/.github/.github/workflows/reusable-security.yml@main
    with:
      language: 'go'
      go-version: '1.22'
      trivy-severity: 'CRITICAL,HIGH'
      fail-on-critical: true

  # 3. Build da Imagem Docker e Scan de Vulnerabilidade de Container
  docker-build:
    name: Docker Container Build
    needs: security
    uses: oseiasal/.github/.github/workflows/reusable-build.yml@main
    with:
      dockerfile-path: 'Dockerfile'
      image-name: '$REPOSITORY_NAME'
      push-image: false
