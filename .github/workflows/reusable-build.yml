name: Container Build Workflow

on:
  workflow_call:
    inputs:
      dockerfile-path:
        description: 'Caminho para o Dockerfile'
        required: false
        type: string
        default: 'Dockerfile'
      image-name:
        description: 'Nome da imagem Docker'
        required: false
        type: string
        default: 'service'
      push-image:
        description: 'Se deve fazer push da imagem'
        required: false
        type: boolean
        default: false

jobs:
  docker-build:
    name: Docker Build & Container Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ inputs.dockerfile-path }}
          load: true
          tags: |
            ${{ inputs.image-name }}:latest
            ${{ inputs.image-name }}:${{ github.sha }}

      - name: 🛡️ Container Vulnerability Scan (Trivy)
        uses: aquasecurity/trivy-action@v0.20.0
        with:
          image-ref: '${{ inputs.image-name }}:${{ github.sha }}'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
