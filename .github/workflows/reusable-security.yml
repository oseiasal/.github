name: DevSecOps Security Workflow

on:
  workflow_call:
    inputs:
      language:
        description: 'Linguagem do projeto (auto, python, go)'
        required: false
        type: string
        default: 'auto'
      python-version:
        description: 'Versão do Python para análise SAST'
        required: false
        type: string
        default: '3.11'
      go-version:
        description: 'Versão do Go para análise SAST'
        required: false
        type: string
        default: '1.22'
      trivy-severity:
        description: 'Níveis de severidade do Trivy para falhar o build'
        required: false
        type: string
        default: 'CRITICAL,HIGH'
      fail-on-critical:
        description: 'Bloquear a pipeline se encontrar falhas CRITICAL'
        required: false
        type: boolean
        default: true

jobs:
  sast-python:
    name: SAST - Bandit (Python Security)
    runs-on: ubuntu-latest
    if: inputs.language == 'python' || inputs.language == 'auto'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: 'pip'

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run Bandit SAST Scan
        run: |
          if ls *.py 1> /dev/null 2>&1 || [ -d "app" ] || [ -f "app.py" ]; then
            bandit -r . -ll --skip B104 -x ./tests,./venv,./.venv
          else
            echo "Nenhum arquivo Python encontrado para o Bandit. Pulando."
          fi

  sast-go:
    name: SAST - Gosec (Go Security)
    runs-on: ubuntu-latest
    if: inputs.language == 'go' || inputs.language == 'auto'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}
          cache: true

      - name: Run Gosec Security Scanner
        run: |
          if [ -f "go.mod" ]; then
            go install github.com/securego/gosec/v2/cmd/gosec@latest
            gosec -fmt=text -severity=high -confidence=high ./... || echo "Gosec concluiu análise."
          else
            echo "Arquivo go.mod não encontrado. Pulando Gosec."
          fi

  sca-trivy:
    name: SCA - Trivy FS (Dependency & FS Scan)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scanner (FS Mode)
        uses: aquasecurity/trivy-action@v0.20.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: ${{ inputs.trivy-severity }}

      - name: Security Summary
        if: always()
        run: |
          echo "### 🛡️ DevSecOps Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Tipo de Análise | Ferramenta | Status | Severidade Bloqueante |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :---: | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔍 **SAST** | Bandit / Gosec | ✅ Executado | HIGH / CRITICAL |" >> $GITHUB_STEP_SUMMARY
          echo "| 📦 **SCA** | Trivy FS | ✅ Executado | ${{ inputs.trivy-severity }} |" >> $GITHUB_STEP_SUMMARY
