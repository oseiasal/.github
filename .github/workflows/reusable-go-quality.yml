name: Go Quality Workflow

on:
  workflow_call:
    inputs:
      go-version:
        description: 'Versão do Go'
        required: false
        type: string
        default: '1.22'

jobs:
  lint:
    name: Linter / Static Analysis (Go)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}
          cache: true

      - name: Run Go Vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.59.1
          args: --timeout=5m
        continue-on-error: true

  build-and-test:
    name: Build & Unit Tests (Go)
    runs-on: ubuntu-latest
    needs: [lint]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}
          cache: true

      - name: Download Go Dependencies
        run: go mod download

      - name: Compile / Build Go Code
        run: go build -v ./...

      - name: Run Unit Tests
        run: |
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./... || echo "Testes finalizados."

      - name: Upload Go Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage-report
          path: coverage.out
          if-no-files-found: ignore
