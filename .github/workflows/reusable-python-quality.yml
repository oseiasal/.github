name: Python Quality Workflow

on:
  workflow_call:
    inputs:
      python-version:
        description: 'Versão do Python'
        required: false
        type: string
        default: '3.11'

jobs:
  lint:
    name: Linter / Static Analysis (Python)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: 'pip'

      - name: Install Lint Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff flake8

      - name: Run Ruff Linter & Format Check
        run: |
          ruff check . || true
          ruff format --check . || true

      - name: Run Flake8 Analysis
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  unit-test:
    name: Build & Unit Tests (Python)
    runs-on: ubuntu-latest
    needs: [lint]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install pytest pytest-cov

      - name: Run Unit Tests & Coverage
        run: |
          if [ -d "tests" ] || ls test_*.py 1> /dev/null 2>&1 || ls *_test.py 1> /dev/null 2>&1; then
            PYTHONPATH=. pytest --cov=. --cov-report=xml --cov-report=term-missing
          else
            echo "Nenhum teste unitário encontrado. Validando compilação do código Python..."
            python -m compileall .
          fi

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-report
          path: coverage.xml
          if-no-files-found: ignore
