name: Docker Build & ECR Push

on:
  workflow_call:
    inputs:
      image-name:
        description: 'Nome da imagem / repositório no ECR'
        required: true
        type: string
      dockerfile-path:
        description: 'Caminho para o Dockerfile'
        required: false
        type: string
        default: 'Dockerfile'
      aws-region:
        description: 'Região da AWS para o ECR'
        required: false
        type: string
        default: 'us-east-1'
      push-image:
        description: 'Se deve efetuar o push para o ECR'
        required: false
        type: boolean
        default: true
      tag-latest:
        description: 'Se deve marcar a tag latest'
        required: false
        type: boolean
        default: true
      scan-image:
        description: 'Executar Trivy Container Scan na imagem Docker construída'
        required: false
        type: boolean
        default: true
      fail-on-critical:
        description: 'Bloquear o push caso sejam encontradas vulnerabilidades críticas'
        required: false
        type: boolean
        default: true
      trivy-severity:
        description: 'Severidades a verificar no Container Scan'
        required: false
        type: string
        default: 'CRITICAL,HIGH'
    secrets:
      AWS_ACCOUNT_ID:
        description: 'ID da conta AWS (opcional se AWS_ROLE_TO_ASSUME for informado)'
        required: false
      AWS_ROLE_TO_ASSUME:
        description: 'ARN da Role IAM OIDC a ser assumida'
        required: false

jobs:
  ecr-push:
    name: Docker Build & ECR Push
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Local Image
        run: |
          docker build -f ${{ inputs.dockerfile-path }} -t ${{ inputs.image-name }}:${{ github.sha }} .
          if [ "${{ inputs.tag-latest }}" = "true" ]; then
            docker tag ${{ inputs.image-name }}:${{ github.sha }} ${{ inputs.image-name }}:latest
          fi

      # 🛡️ Container Scan com Trivy (na imagem Docker antes do push para o ECR)
      - name: 🛡️ Trivy Container Image Scan
        if: inputs.scan-image
        uses: aquasecurity/trivy-action@v0.20.0
        with:
          scan-type: 'image'
          image-ref: '${{ inputs.image-name }}:${{ github.sha }}'
          format: 'table'
          output: 'trivy-container-results.txt'
          exit-code: ${{ inputs.fail-on-critical && '1' || '0' }}
          ignore-unfixed: true
          severity: ${{ inputs.trivy-severity }}

      - name: 📋 Container Scan Summary
        if: always() && inputs.scan-image
        run: |
          echo "### 🐳 Trivy Container Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Propriedade | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Imagem Analisada** | \`${{ inputs.image-name }}:${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Severidades** | \`${{ inputs.trivy-severity }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Bloquear em Críticas** | \`${{ inputs.fail-on-critical }}\` |" >> $GITHUB_STEP_SUMMARY

          if [ -f trivy-container-results.txt ] && [ -s trivy-container-results.txt ]; then
            cat trivy-container-results.txt
            if grep -E "(CRITICAL|HIGH|MEDIUM|LOW):" trivy-container-results.txt > /dev/null 2>&1 || grep -E "Total:" trivy-container-results.txt > /dev/null 2>&1; then
              echo "| ⚠️ **Resultado Scan** | **⚠️ Vulnerabilidades encontradas na imagem** |" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "#### 📋 Detalhes das Vulnerabilidades (Trivy Container)" >> $GITHUB_STEP_SUMMARY
              echo "<details open><summary><b>Clique para ver as vulnerabilidades</b></summary>" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo '```text' >> $GITHUB_STEP_SUMMARY
              cat trivy-container-results.txt >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              echo "</details>" >> $GITHUB_STEP_SUMMARY
            else
              echo "| ✅ **Resultado Scan** | **✅ Nenhuma vulnerabilidade encontrada na imagem** |" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "| ✅ **Resultado Scan** | **✅ Nenhuma vulnerabilidade encontrada na imagem** |" >> $GITHUB_STEP_SUMMARY
          fi

      # 1. Configurar Role ARN para autenticacao OIDC
      - name: Configure AWS OIDC Role ARN
        id: oidc-setup
        if: inputs.push-image
        env:
          ROLE_ARN: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          if [ -n "$ROLE_ARN" ]; then
            echo "role_arn=$ROLE_ARN" >> $GITHUB_OUTPUT
          elif [ -n "$ACCOUNT_ID" ]; then
            echo "role_arn=arn:aws:iam::${ACCOUNT_ID}:role/GitHubActionsECRRole" >> $GITHUB_OUTPUT
          else
            echo "::error::Autenticacao OIDC requer AWS_ROLE_TO_ASSUME ou AWS_ACCOUNT_ID configurados nos secrets."
            exit 1
          fi

      # 2. Autenticacao AWS exclusivamente via OIDC (Sem credenciais estaticas)
      - name: Configure AWS Credentials (OIDC Only)
        if: inputs.push-image
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.oidc-setup.outputs.role_arn }}
          aws-region: ${{ inputs.aws-region }}
          audience: sts.amazonaws.com

      # 3. Login no Amazon ECR
      - name: Login to Amazon ECR
        if: inputs.push-image
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 4. Push para o Amazon ECR
      - name: Push Image to Amazon ECR
        if: inputs.push-image
        run: |
          ECR_REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          TARGET_IMAGE="$ECR_REGISTRY/${{ inputs.image-name }}"
          
          docker tag ${{ inputs.image-name }}:${{ github.sha }} $TARGET_IMAGE:${{ github.sha }}
          docker push $TARGET_IMAGE:${{ github.sha }}
          
          if [ "${{ inputs.tag-latest }}" = "true" ]; then
            docker tag ${{ inputs.image-name }}:${{ github.sha }} $TARGET_IMAGE:latest
            docker push $TARGET_IMAGE:latest
          fi

      - name: Amazon ECR Push Summary
        if: always()
        run: |
          echo "### 🐳 Amazon ECR Build & Push Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Propriedade | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Imagem** | \`${{ inputs.image-name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Tag SHA** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Região AWS** | \`${{ inputs.aws-region }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Modo Auth** | \`OIDC (AssumeRoleWithWebIdentity)\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Role ARN** | \`${{ steps.oidc-setup.outputs.role_arn }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Push Efetuado** | \`${{ inputs.push-image }}\` |" >> $GITHUB_STEP_SUMMARY
